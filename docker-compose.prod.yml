name: sweaty-candy

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - sweaty-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nakama:
    image: sweaty-candy-nakama:latest
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
          /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama &&
          exec /nakama/nakama --name nakama1 --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama --logger.level INFO --session.token_expiry_sec 7200 --session.refresh_token_expiry_sec 604800 --runtime.js_entrypoint build/index.js --socket.server_key ${NAKAMA_SERVER_KEY:-defaultkey} --session.encryption_key ${NAKAMA_ENCRYPTION_KEY:-defaultencryptionkey} --runtime.http_key ${NAKAMA_HTTP_KEY:-defaulthttpkey} --console.username ${CONSOLE_USERNAME:-admin} --console.password ${CONSOLE_PASSWORD:-password}
    ports:
      - "127.0.0.1:7350:7350"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  static:
    image: sweaty-candy-static:latest
    pull_policy: never
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sweaty-pg-data:
    name: sweaty-pg-data

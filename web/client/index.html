<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b10" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff8c1a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%232f7bff'/%3E%3C/svg%3E" />
<title>Sweaty Candy</title>
<link rel="stylesheet" href="/css/style.css" />
<script type="importmap">
{
  "imports": {
    "phaser": "/node_modules/phaser/dist/phaser.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="app">

  <div id="game-container"></div>

  <div id="touch-controls" class="hidden">
    <div id="stick-left" class="stick">
      <div class="stick-ring"></div>
      <div class="stick-handle"></div>
    </div>
    <div id="stick-right" class="stick">
      <div class="stick-ring"></div>
      <div class="stick-handle"></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="hud-top-left">
      <div class="hud-row">
        <span class="hud-label">HP</span>
        <div class="bar"><div id="hud-health" class="bar-fill"></div></div>
        <span id="hud-health-text" class="hud-num">100</span>
      </div>
      <div id="hud-players" class="hud-players"></div>
    </div>
    <div id="hud-top-center"></div>
    <div id="hud-top-right"><span id="hud-ping" class="ping">--</span></div>
    <div id="hud-bottom-center"></div>
  </div>

  <div id="screen-menu" class="screen">
    <div class="panel">
      <h1 class="title">SWEATY CANDY</h1>
      <p class="subtitle">isometric horde shooter</p>
      <input id="menu-name" type="text" maxlength="20" placeholder="display name (optional)" autocomplete="off" />
      <button id="btn-play" class="btn primary">Play</button>
      <p id="menu-status" class="status"></p>
    </div>
  </div>

  <div id="screen-lobby" class="screen hidden">
    <div class="panel wide">
      <div class="row-between">
        <h2>Main Lobby</h2>
        <span id="lobby-user" class="muted"></span>
      </div>
      <table id="lobby-table">
        <thead><tr><th>Room</th><th>Players</th><th>Status</th><th></th></tr></thead>
        <tbody id="lobby-rows"></tbody>
      </table>
      <p id="lobby-status" class="status"></p>
      <div class="row">
        <button id="btn-create" class="btn">Create Room</button>
        <button id="btn-refresh" class="btn">Refresh</button>
        <button id="btn-lobby-back" class="btn ghost">Back</button>
      </div>
    </div>
  </div>

  <div id="create-modal" class="overlay hidden">
    <div class="panel">
      <h2>Create Room</h2>
      <input id="create-name" type="text" maxlength="24" placeholder="room name (optional)" />
      <input id="create-pass" type="text" maxlength="11" placeholder="password (optional, 4-11 chars)" />
      <div class="row">
        <span class="muted">Max players</span>
        <select id="create-max">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
        </select>
      </div>
      <p id="create-status" class="status"></p>
      <div class="row">
        <button id="btn-create-confirm" class="btn primary">Create</button>
        <button id="btn-create-cancel" class="btn ghost">Cancel</button>
      </div>
    </div>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <div class="panel">
      <h2 id="waiting-name">Room</h2>
      <p id="waiting-id" class="muted"></p>
      <div id="waiting-players" class="waiting-players"></div>
      <p id="waiting-state" class="status"></p>
      <div class="row">
        <button id="btn-start" class="btn primary hidden">Start Game</button>
        <button id="btn-leave" class="btn ghost">Leave</button>
      </div>
    </div>
  </div>

  <div id="game-over" class="overlay hidden">
    <div class="panel">
      <h2>GAME OVER</h2>
      <p id="gameover-stats" class="stats"></p>
      <button id="btn-gameover-back" class="btn primary">Back to Lobby</button>
    </div>
  </div>

</div>
<script type="module" src="/js/loader.js"></script>
</body>
</html>
